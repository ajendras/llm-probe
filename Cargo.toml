[package]
name = "llm-probe"
version = "0.1.0"
edition = "2021"
description = "Automated red-teaming CLI for LLMs that launches adversarial attacks and scores prompt injection, jailbreak and leakage risks"
license = "MIT OR Apache-2.0"
authors = ["LLM Probe Contributors"]
repository = "https://github.com/example/llm-probe"

[[bin]]
name = "llm-probe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
colored = "2.1"
comfy-table = "7.1"
anyhow = "1.0"
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
